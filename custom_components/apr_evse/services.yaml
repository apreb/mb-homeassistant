# Target is optional -- an untargeted call goes to every configured charger.
set_car_soc:
  target:
    device:
      integration: apr_evse
    entity:
      integration: apr_evse
  fields:
    soc:
      required: true
      example: 64
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_home_battery_soc:
  target:
    device:
      integration: apr_evse
    entity:
      integration: apr_evse
  fields:
    soc:
      required: true
      example: 85
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    amps:
      required: false
      example: 15.2
      selector:
        number:
          min: -100
          max: 100
          step: 0.1
          unit_of_measurement: A
    power:
      required: false
      example: 3500
      selector:
        number:
          min: -32768
          max: 32767
          step: 1
          unit_of_measurement: W
